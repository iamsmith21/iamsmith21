<svg viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <defs>
    <radialGradient id="bgGlow" cx="15%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a1233" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="900" height="240" rx="12" fill="url(#bgGlow)"/>
  <rect x="0.5" y="0.5" width="899" height="239" rx="11.5" fill="none" stroke="#241b3d"/>

  <!-- reactor -->
  <g transform="translate(150,120)">
    <circle r="55" fill="url(#coreGlow)"/>
    <circle r="66" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="50" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.8"/>
    <circle r="38" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    <circle r="6" fill="#22d3ee"/>

    <!-- radar sweep -->
    <g>
      <path d="M0,0 L0,-66 A66,66 0 0,1 25,-61 Z" fill="#22d3ee" opacity="0.15">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- module labels -->
    <text x="0" y="-78" fill="#94a3b8" font-size="11" text-anchor="middle">PY</text>
    <text x="82" y="4" fill="#94a3b8" font-size="11" text-anchor="middle">JS</text>
    <text x="0" y="92" fill="#94a3b8" font-size="11" text-anchor="middle">TS</text>
    <text x="-82" y="4" fill="#94a3b8" font-size="11" text-anchor="middle">JAVA</text>
  </g>

  <!-- text block -->
  <text x="270" y="98" fill="#e2e8f0" font-size="34" font-weight="700">SMITH PATEL</text>
  <text x="270" y="126" fill="#22d3ee" font-size="14" letter-spacing="1">FULL STACK DEVELOPER — YORK UNIVERSITY</text>

  <text x="270" y="160" fill="#64748b" font-size="13">
    <tspan fill="#8b5cf6">&gt;</tspan> shipping end-to-end, from database to UI
  </text>

  <g>
    <circle cx="272" cy="188" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="284" y="192" fill="#94a3b8" font-size="12" letter-spacing="0.5">SYSTEM ONLINE — TORONTO, ON</text>
  </g>
</svg>
